name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Generated schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.24'
          python-version: '3.13.15'
          activate-environment: true
      - run: uv pip install -r hub/schema/requirements.txt
      - run: python scripts/regenerate_schema.py --check

  hash-state:
    name: Saved hash state / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Check saved states without the Hub runtime dependencies
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          uv venv --python "$PYTHON_VERSION" .venv
          uv pip install --python .venv/bin/python sha256==1.0
          .venv/bin/python -m unittest tests.test_sha256 -v

  database:
    name: Database / ${{ matrix.binding }} RocksDB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        binding: [published, maintained]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the maintained binding
        if: matrix.binding == 'maintained'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kodxana/lbry-rocksdb-ng
          ref: cdbe008312a191b3099065a94c470818b10d6d9d
          path: .ci/rocksdb
          submodules: true
          persist-credentials: false
      - name: Build and test the maintained binding
        if: matrix.binding == 'maintained'
        env:
          TEST_OUTPUT_DIR: ${{ github.workspace }}/ci-results/rocksdb
        run: sh .ci/rocksdb/scripts/test.sh 3.13
      - name: Test the installed Hub package
        env:
          BINDING: ${{ matrix.binding }}
          TEST_OUTPUT_DIR: ${{ github.workspace }}/ci-results/database
        run: |
          if [ "$BINDING" = published ]; then
            sh scripts/test.sh
          else
            set -- "$GITHUB_WORKSPACE/ci-results/rocksdb/"*.whl
            [ "$#" -eq 1 ]
            sh scripts/test.sh "$1"
          fi
      - name: Upload wheels and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-${{ matrix.binding }}
          path: ci-results/
          retention-days: 14

  resolve:
    name: Resolve / ${{ matrix.binding }} RocksDB
    needs: database
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        binding: [published, maintained]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the matching SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kodxana/lbry-sdk-ng
          ref: c85b9d4767db8226896a8ddfc6acd80db14614ca
          path: .ci/sdk
          persist-credentials: false
      - name: Download the tested binding
        if: matrix.binding == 'maintained'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: database-maintained
          path: .ci/artifacts
      - name: Configure Elasticsearch mmap limit
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Run session, resolve and reorg tests
        env:
          BINDING: ${{ matrix.binding }}
          TEST_OUTPUT_DIR: ${{ github.workspace }}/ci-results/resolve
        run: |
          if [ "$BINDING" = published ]; then
            sh scripts/test-integration.sh .ci/sdk
          else
            set -- "$GITHUB_WORKSPACE/.ci/artifacts/rocksdb/"*.whl
            [ "$#" -eq 1 ]
            sh scripts/test-integration.sh .ci/sdk "$1"
          fi
      - name: Upload logs and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolve-${{ matrix.binding }}
          path: ci-results/resolve/
          retention-days: 14
