name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database / ${{ matrix.binding }} RocksDB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        binding: [published, maintained]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the maintained binding
        if: matrix.binding == 'maintained'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kodxana/lbry-rocksdb-ng
          ref: c540bbc9502293101dc29a8535443a69bcf0b821
          path: .ci/rocksdb
          submodules: true
          persist-credentials: false
      - name: Build and test the maintained binding
        if: matrix.binding == 'maintained'
        env:
          TEST_OUTPUT_DIR: ${{ github.workspace }}/ci-results/rocksdb
        run: sh .ci/rocksdb/scripts/test.sh 3.9
      - name: Test the installed Hub package
        env:
          BINDING: ${{ matrix.binding }}
          TEST_OUTPUT_DIR: ${{ github.workspace }}/ci-results/database
        run: |
          if [ "$BINDING" = published ]; then
            sh scripts/test.sh
          else
            set -- "$GITHUB_WORKSPACE/ci-results/rocksdb/"*.whl
            [ "$#" -eq 1 ]
            sh scripts/test.sh "$1"
          fi
      - name: Upload wheels and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-${{ matrix.binding }}
          path: ci-results/
          retention-days: 14

  resolve:
    name: Resolve / ${{ matrix.binding }} RocksDB
    needs: database
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        binding: [published, maintained]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the matching SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kodxana/lbry-sdk-ng
          ref: c85b9d4767db8226896a8ddfc6acd80db14614ca
          path: .ci/sdk
          persist-credentials: false
      - name: Download the tested binding
        if: matrix.binding == 'maintained'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: database-maintained
          path: .ci/artifacts
      - name: Configure Elasticsearch mmap limit
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Run session, resolve and reorg tests
        env:
          BINDING: ${{ matrix.binding }}
          TEST_OUTPUT_DIR: ${{ github.workspace }}/ci-results/resolve
        run: |
          if [ "$BINDING" = published ]; then
            sh scripts/test-integration.sh .ci/sdk
          else
            set -- "$GITHUB_WORKSPACE/.ci/artifacts/rocksdb/"*.whl
            [ "$#" -eq 1 ]
            sh scripts/test-integration.sh .ci/sdk "$1"
          fi
      - name: Upload logs and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolve-${{ matrix.binding }}
          path: ci-results/resolve/
          retention-days: 14
