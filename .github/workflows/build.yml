name: Database tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database / ${{ matrix.binding }} RocksDB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        binding: [published, maintained]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the maintained binding
        if: matrix.binding == 'maintained'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kodxana/lbry-rocksdb
          ref: c4c9e7dc45f32ad99cfff934798b51624f41ed69
          path: .ci/rocksdb
          submodules: true
          persist-credentials: false
      - name: Build and test the maintained binding
        if: matrix.binding == 'maintained'
        env:
          TEST_OUTPUT_DIR: ${{ github.workspace }}/ci-results/rocksdb
        run: sh .ci/rocksdb/scripts/test.sh 3.9
      - name: Test the installed Scribe package
        env:
          BINDING: ${{ matrix.binding }}
          TEST_OUTPUT_DIR: ${{ github.workspace }}/ci-results/database
        run: |
          if [ "$BINDING" = published ]; then
            sh scripts/test.sh
          else
            set -- "$GITHUB_WORKSPACE/ci-results/rocksdb/"*.whl
            [ "$#" -eq 1 ]
            sh scripts/test.sh "$1"
          fi
      - name: Upload wheels and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-${{ matrix.binding }}
          path: ci-results/
          retention-days: 14
